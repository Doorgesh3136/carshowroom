<!DOCTYPE html><html lang="en" class="js"><head>
  <meta charset="UTF-8" />
  <script>try{var h=document.documentElement;if(sessionStorage.getItem("v8-pt"))h.classList.add("pt-in")}catch(e){}</script>
  <meta name="theme-color" content="#a3adba" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="images/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Cars in stock — V8 Motors, Coromandel</title>
  <meta name="description" content="Every car currently for sale at V8 Motors, Coromandel, Mauritius — live stock with photos and prices." />
</head>
<body data-page="cars">
  <main>
    <section class="wrap ph">
      <div class="row">
        <h1 class="h1" data-hero>Cars in stock</h1>
        <p class="lead" data-hi>Our full stock, updated as new cars arrive. Select a car for photos, specifications and to book a viewing.</p>
      </div>
    </section>
    <section class="wrap" style="padding-bottom:40px">
      <div class="tools" data-reveal>
        <div class="chips" id="chips">
          <button class="chip on" data-f="all">All<sup id="n-all"></sup></button>
          <button class="chip" data-f="suv">SUV<sup id="n-suv"></sup></button>
          <button class="chip" data-f="hatch">Hatchback<sup id="n-hatch"></sup></button>
          <button class="chip" data-f="sedan">Sedan<sup id="n-sedan"></sup></button>
          <button class="chip" data-f="work">Pickup &amp; Van<sup id="n-work"></sup></button>
          <button class="chip" data-f="deal">Deals<sup id="n-deal"></sup></button>
        </div>
        <div class="tools-r">
          <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Search make, model, colour…" /></label>
          <select class="sel" id="sort" aria-label="Sort">
            <option value="new">Newest</option>
            <option value="lo">Price ↑</option>
            <option value="hi">Price ↓</option>
            <option value="yr">Year ↓</option>
          </select>
        </div>
      </div>
      <p class="lb" id="count" style="margin:0 0 18px 6px"></p>
      <div class="grid" id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
      <div class="empty" id="empty" hidden><p class="h3">No cars match your search.</p><p class="muted" style="margin-top:10px">New stock arrives every week — call 5259 0327 and we&#39;ll find it for you.</p></div>
      <div class="more"><button class="btn ol" id="more" hidden>Show more<span class="ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button></div>
    </section>
  </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/snapshot.js"></script>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
  <script src="js/cars.js"></script>
</body></html>
